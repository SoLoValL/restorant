<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ресторан{% endblock %}</title>
    {% load static %}
    <link href="{% static 'bootstrap/5.3.3/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'font-awesome/6.5.0/css/all.min.css' %}" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a96e;
            --dark: #1a1a2e;
            --transition-speed: 0.4s;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        /* ===== Анимации появления ===== */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .animate-on-scroll.animate-left {
            transform: translateX(-60px);
        }
        .animate-on-scroll.animate-right {
            transform: translateX(60px);
        }
        .animate-on-scroll.animate-scale {
            transform: scale(0.85);
        }
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0) translateX(0) scale(1);
        }

        /* Задержки для каскада */
        .stagger-1 { transition-delay: 0.1s; }
        .stagger-2 { transition-delay: 0.2s; }
        .stagger-3 { transition-delay: 0.3s; }
        .stagger-4 { transition-delay: 0.4s; }
        .stagger-5 { transition-delay: 0.5s; }

        /* ===== Навбар ===== */
        .navbar {
            background: var(--dark) !important;
            transition: background 0.3s ease, box-shadow 0.3s ease, padding 0.3s ease;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .navbar.scrolled {
            background: rgba(26, 26, 46, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .nav-link {
            color: var(--gold) !important;
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s ease, left 0.3s ease;
        }
        .nav-link:hover::after {
            width: 80%;
            left: 10%;
        }
        .nav-link:hover {
            color: #fff !important;
            transform: translateY(-2px);
        }
        .navbar-brand {
            color: var(--gold) !important;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .navbar-brand:hover {
            color: #fff !important;
            transform: scale(1.05);
        }

        /* ===== Hero ===== */
        .hero {
            background: linear-gradient(rgba(26,26,46,0.7), rgba(26,26,46,0.7)),
                        url('/media/hero/restaurant-interior.jpg') center/cover;
            min-height: 80vh;
            display: flex;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(26,26,46,0.4) 100%);
            animation: heroPulse 6s ease-in-out infinite;
        }
        @keyframes heroPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        .hero h1 {
            font-size: 3.5rem;
            color: var(--gold);
            animation: fadeInDown 1s ease-out;
        }
        .hero p {
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        .hero .btn {
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Заголовки секций ===== */
        .section-title {
            color: var(--dark);
            font-weight: bold;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 0.5rem auto 0;
            transform: scaleX(0);
            transition: transform 0.6s ease 0.3s;
        }
        .animate-on-scroll.visible .section-title::after {
            transform: scaleX(1);
        }

        /* ===== Карточки ===== */
        .card {
            border: none;
            transition: transform var(--transition-speed) cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow var(--transition-speed) ease,
                        filter var(--transition-speed) ease;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 110, 0.1), transparent);
            transition: left 0.6s ease;
        }
        .card:hover::before {
            left: 100%;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(201, 169, 110, 0.2);
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .card:hover .card-img-top {
            transform: scale(1.1);
        }
        .card-body {
            transition: padding 0.3s ease;
        }
        .card:hover .card-body {
            padding-top: 1.2rem;
            padding-bottom: 1.2rem;
        }

        /* ===== Кнопки ===== */
        .gold-btn {
            background: var(--gold);
            color: white;
            border: none;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }
        .gold-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
            z-index: -1;
        }
        .gold-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        .gold-btn:hover {
            background: #b8944f;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.4);
        }
        .gold-btn:active {
            transform: translateY(-1px);
        }

        /* ===== Бейджи ===== */
        .badge {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .badge:hover {
            transform: scale(1.1);
        }

        /* ===== Звёзды рейтинга ===== */
        .rating i {
            color: var(--gold);
            font-size: 1.2rem;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: default;
        }
        .rating i.far {
            color: #ddd;
        }
        .rating i:hover {
            transform: scale(1.3) rotate(15deg);
        }

        /* ===== Футер ===== */
        .footer {
            background: var(--dark);
            color: var(--gold);
            transition: transform 0.3s ease;
        }

        /* ===== Параллакс-эффект для фонов ===== */
        .bg-light {
            transition: background 0.3s ease;
        }

        /* ===== Пульсация для CTA ===== */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 110, 0.6); }
            50% { box-shadow: 0 0 0 15px rgba(201, 169, 110, 0); }
        }
        .hero .btn-lg {
            animation: fadeInUp 1s ease-out 0.6s both, pulse 2s ease-in-out 1.6s infinite;
        }

        /* ===== Плавное появление секций ===== */
        section {
            transition: opacity 0.6s ease;
        }

        /* ===== Иконки ===== */
        .fa-2x, .fa-3x {
            transition: transform 0.4s ease, color 0.4s ease;
        }
        .card:hover .fa-2x,
        .card:hover .fa-3x {
            transform: rotateY(180deg);
            color: var(--gold);
        }

        /* ===== Формы ===== */
        .form-control {
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.2rem rgba(201, 169, 110, 0.25);
            transform: translateY(-2px);
        }

        /* ===== Лоадер ===== */
        #page-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(201, 169, 110, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Адаптивность ===== */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .animate-on-scroll.animate-left,
            .animate-on-scroll.animate-right {
                transform: translateY(40px);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="page-loader"><div class="loader-spinner"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="{% url 'home' %}"><i class="fas fa-utensils me-2"></i>Ресторан</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="#menu">Меню</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'restaurant_map' %}">Зал</a></li>
                    <li class="nav-item"><a class="nav-link" href="#blog">Блог</a></li>
                    <li class="nav-item"><a class="nav-link" href="#events">События</a></li>
                    <li class="nav-item"><a class="nav-link" href="#reviews">Отзывы</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="footer py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Ресторан. Все права защищены.</p>
        </div>
    </footer>

    <script src="{% static 'bootstrap/5.3.3/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        // Лоадер страницы
        window.addEventListener('load', () => {
            document.getElementById('page-loader').classList.add('hidden');
        });

        // Навбар при скролле
        const navbar = document.querySelector('.navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        });

        // Анимации при скролле (Intersection Observer)
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-on-scroll').forEach(el => {
            observer.observe(el);
        });

        // Плавный скролл для якорных ссылок
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // Закрыть мобильное меню
                    const navCollapse = document.getElementById('nav');
                    if (navCollapse.classList.contains('show')) {
                        bootstrap.Collapse.getInstance(navCollapse)?.hide();
                    }
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
